# Collection names, truth-matching definitions, windows and limits the
# scoreboard reads (zdc-setup.md, sections Scoreboard and Noise and
# significance). Step 0 verifies every collection and field name against a
# reconstructed file and corrects this file once; after that it is frozen.
# Limits marked "user" are set at the Phase 0 checkpoint (question 4) and
# recorded as D-user entries; until then the agent's proposed defaults apply.

collections:
  zdc_clusters: HcalFarForwardZDCClusters
  zdc_cluster_assoc: HcalFarForwardZDCClusterAssociations   # edm4eic::MCRecoClusterParticleAssociation: weight, rec -> cluster, sim -> MCParticle
  zdc_rechits: HcalFarForwardZDCRecHits
  zdc_subcell_hits: HcalFarForwardZDCSubcellHits
  zdc_truth_clusters: HcalFarForwardZDCTruthClusters
  zdc_neutrals: ReconstructedHcalFarForwardZDCNeutrals     # EICrecon main at the pin
  lambdas: ReconstructedLambdas                            # main since 2026-05-29 (#2622); the benchmarks still say ReconstructedFarForwardZDCLambdas
  lambda_decay_cm: ReconstructedLambdaDecayProductsCM
  lambdas_truthchain: ReconstructedLambdasTruth            # written by the Rt build only
  mc_particles: MCParticles

# podio relation branches (verified at Step 0 against a file)
relations:
  assoc_rec_index: _HcalFarForwardZDCClusterAssociations_rec.index
  assoc_sim_index: _HcalFarForwardZDCClusterAssociations_sim.index
  cluster_hits_index: _HcalFarForwardZDCClusters_hits.index
  mc_daughters_index: _MCParticles_daughters.index

# Collections that must stay identical to R0 (gate G4): every collection whose
# name does not start with one of these prefixes (the owned list).
zdc_owned_prefixes:
  - HcalFarForwardZDC
  - EcalFarForwardZDC
  - ReconstructedHcalFarForwardZDCNeutrals
  - ReconstructedB0EcalNeutrals          # outputs of the one FarForwardNeutralsReconstruction factory
  - ReconstructedEcalEndcapPNeutrals
  - ReconstructedLFHCALNeutrals
  - ReconstructedLambdas
  - ReconstructedLambdaDecayProductsCM
  - ReconstructedFarForwardZDC

# Geometry constants (benchmark conventions)
crossing_angle_rad: -0.025
zdc_face_z_mm: 35800.0
subcell_pitch_mm: 24.4          # HEXPLIT S2: side_length / 2; the neighbour distance acts as a step function of it

# Truth matching (zdc-setup.md, Scoreboard)
truth_match:
  purity_min: 0.8               # best cluster's association weight for the particle
  containment_min: 0.5          # share of the particle's associated energy held by the best cluster
  photon_pdg: 22
  neutron_pdg: 2112
  lambda_pdg: 3122
  pi0_pdg: 111

windows:
  pi0_mass_gev: 0.1349768
  lambda_mass_gev: 1.115683
  lambda_mass_half_window_gev: 0.03   # fixed for the program (not "3σ of R0": R0 may have no peak); the Rt ceiling uses the same
  high_energy_cluster_gev: 50.0       # G2
  low_energy_cluster_gev: 5.0         # G3; calibrated cluster energy: minClusterEdep 50 MeV deposit ÷ sampFrac 0.0273 = 1.83 GeV is the floor, so 1 GeV counted nothing
  phi_edge_deg: 5.0                   # G1: |phi| within this of 180

fits:
  energy_fit_half_width_rel: 0.1      # the benchmarks fit ±10 % around the momentum
  mass_fit_bins: 100
  bootstrap_resamples: 200

# Significance of the paired test and the guard limits (zdc-setup.md, Noise and significance)
significance_sigma: 3.0
limits:
  S2_scale_abs_dev_max: 0.05          # |μ/E − 1| − 2σ per D2 energy, μ/E from the clustering's own refit (D-user-13, D-user-17)
  gamma_raw_sum_rel_drop_max: 0.05    # D-user-16 (Q9 A): one-sided, D2 photons' energy in surviving clusters / E_true vs the current best
  S3_raw_sum_rel_change_max: 0.05     # relative DROP of Σ E_cluster / E_true vs the current best, per D3 momentum (D-user-12, Q8 answer A)
  S3_raw_sum_direction: drop_only     # D-user-12: an increase passes when σ/mean of the raw sum does not worsen significantly
  S3_raw_sum_guard_min_momentum_gev: 50   # D-user-26 (Q11 A): the drop limit is a guard at D3 momenta ≥ 50 GeV; 20 GeV is reported
                                      #   (R0's own raw sum at 20 GeV is 0.087; the D4 neutrons carry ≥ 75 GeV)
                                      #   (paired bootstrap, 3σ) and S3 clusters per neutron stays inside its limit
  S3_clusters_per_neutron_max_increase: 0.5
  S3_gamma_tagged_fraction_max: 0.10  # energy fraction tagged γ in neutron events
  S4c_gammas_per_event_max: 4.0       # mean γ-tagged neutrals per Λ event
  G1_phi_at_180_frac_max: 0.15        # D-default-19 (Q4): R0 0.068 (NC) / 0.074 (SIDIS) ×2; R1 1.000
  G1_column_frac_max: 0.05            # D-default-19: fraction of single-(x,y) clusters; R0 0.000, R1 1.000
  G2_highE_frac_rel_change_max: 0.5   # D-default-19: relative drop of the E > 50 GeV fraction vs R0 (0.612 NC, 0.864 SIDIS); R1 −99 %
  G3_lowE_per_event_max: 0.5          # D-default-19: clusters below 5 GeV per event; R0 0.006 / 0.010, R1 2.13 / 5.44

# No experiment config may set these (120_reconstruct.py refuses). D-user-14 (2026-11-05) opened
# LambdaReconstruction from Phase 2 on: pi0Window, lambdaMassWindow and iterations left this list and are
# the Λ family's knobs (D-default-25); the scoring window above (`windows`) stays fixed, so S4a_tm cannot be
# won by widening the reco windows. globalToProtonRotation stays: it is the −25 mrad crossing angle, a fact.
frozen_parameters:
  - "reco:ReconstructedLambdas:globalToProtonRotation"
