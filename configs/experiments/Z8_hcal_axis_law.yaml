# Phase 6 try Z8 (loop v6, free choice, on Z7): the Hcal axis law as a competing energy for tagged Hcal photons. 477
# --why-all on Z7's settings (9x275): of 493 missed all-ZDC Λ whose photons both have a pure candidate, 132 are the right
# pair out of the window (125 high, Δm median +64 MeV); there the neutron reads 1.02 and the photons are off: Hcal-law
# photons 0.69 (149), crystal photons 0.45 (75), crystal-law Hcal photons 1.50 (40). On the photon guns a photon's Hcal
# shower splits into several clusters (the leading one holds 45–60 % above 5 GeV) and the Hcal law on the leading cluster
# scatters ±24–36 %. 481: the axis law E = a·E_crys + b·E_col + c on the crystal and Hcal rec hits within 45 mm of the
# line through the cluster, fitted on D2c + D2 ≤ 50 GeV (2.5938,45.8981,-1.5994), scatters ±10–11 % at 10–50 GeV (±18 % at 5 GeV).
# Every tagged Hcal photon offers it as an alternative energy (as Z5's crystal law; its column beyond its cluster leaves
# the neutron, as Z6). New input EcalFarForwardZDCRecHits (the cone changes: F1 from 478, D-user-43).
# Patch space/notes/patches/Z8_hcal_axis_law.patch on a15b0db6 + Y2 + Y5 + Y9 + Z1b + Z5 + Z6 + Z7; build Z8.
