# Phase 5 try Y8 (loop v5): Y6 narrowed the B0 split sharing exp(−d / s) from s = 1.0 to 0.5 crystal and gained +80 (z +8.1);
# s = 0.3 narrows it further. Parameters on the Y5 install with Y7's B0 photon law.
# hypothesis: γγ-in-B0 is still the regime with the most B0 losses (9x275 87 of 264 found, 9x130 97 of 264); a sharper
# share keeps more of each photon in its own cluster. Predicted N_found 1238 → ~1250, 190 → ~200; but at s = 0.3 a hit one
# crystal from a peak keeps only e^−3.3 of its weight there, so the energy of a photon's shower tail may go to the wrong
# maximum: the gain may stop or turn. Purity flat.
