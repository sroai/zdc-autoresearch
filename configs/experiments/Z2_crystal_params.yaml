# Phase 6 try Z2 (loop v6): run-time parameters of Z1b's crystal photons. Crystal candidates from 0.3 GeV (0.5); the Hcal
# column 60 mm wide (45) with the law refitted on the guns at that radius (1.9092·E_crys + 44.768·E_col − 0.8984; σ 10–11 %
# at 5–50 GeV, calib-crystal-CAL6_D2_Y9-rcol60.json); the column leaves the neutron on the Hcal clusters' scale (× 1/0.0273
# = 36.63, so its energy is no longer counted in the photon and the neutron both).
# hypothesis: 477 on MSF6_Y9 (veto split, depth −10) with these settings: net +151 (9x275) and +13 (9x130), against +118 / +15
# with Z1b's (emulated +31 over Z1b, N_window +113); Z1b reached 45 % of its emulated gain, so ~+14 over Z1b: N_found 1314 →
# ~1328, 232 → ~232; purity flat.
