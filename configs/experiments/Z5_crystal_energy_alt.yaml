# Phase 6 try Z5 (loop v6, free choice): a tagged Hcal photon with a crystal cluster in front of it competes with the
# crystal law's energy (the leading crystal cluster in front and its 60 mm column: σ 10–11 % on the guns, against 24–34 %
# for the Hcal law at 5–50 GeV). Every hypothesis with such a photon is scored with either energy; if the crystal law's
# wins, the photon carries it and links the crystal cluster after its Hcal cluster. Z3's outright replacement lost the Λ
# at 9x275 (−107); as a competing hypothesis the chooser keeps the Hcal law's energy where it fits better.
# Switch crystalEnergyAlternative (default false, true in reco.cc), proven on file 0001: off = Z4 identical, on changes 68
# of 500 events. Patch space/notes/patches/Z5_crystal_energy_alt.patch on a15b0db6 + Y2 + Y5 + Y9 + Z1b; build Z5.
# hypothesis: 477 --alt on Z4's settings (σ_Λ 0.03): 9x275 +317 vs +170 (Z4's emulation), window +547 vs +470; 9x130 +32 vs
# +19, window +82 vs +90: emulated +160 found over Z4 at a nearly flat window. N_found 1409 → ~1556, 237 → ~250; purity up.
