# Phase 6 try Z7 (loop v6, free choice; base Z6 by D-user-44): an isolation term in the Lambda pairing. The photon tag lets
# neutron shower fragments through; 477 --why put "the other photon wrong" first among the missed all-ZDC Lambda (227 at
# 9x275). 480 on Z6's tagged clusters: their shape parameters and depth do not separate photons from fragments (AUC ~0.5,
# the tag already cuts on them); the transverse distance to the most energetic Hcal cluster does (AUC 0.79, within-event
# 0.82; fragments a median 35 mm from the neutron core, photons 88 mm). Every tagged Hcal photon of a hypothesis adds
# w * exp(-d / l) to its score (code: lambdaPairingIsolationWeight / Length, off at weight 0). The length is the neutron
# gun's (CAL6_D3_Z6, 480 --guns: tagged fragments at a mean 42.5 mm from the core, median 34.5 mm; F4); the weight 2 from
# the 477 scan (w 0.5-4 x l 30/60/100 mm, flat at w 2-4).
# Patch space/notes/patches/Z7_isolation.patch on a15b0db6 + Y2 + Y5 + Y9 + Z1b + Z5 + Z6; build Z7.
# hypothesis: 477 --alt --alt-col-out (Z6) with --iso 2:42.5: +88 found over Z6 pooled (9x275 +83, 9x130 +5), N_window
# −42; predicted N_found 1547 → ~1630, 250 → ~255; purity up; −t unchanged.
