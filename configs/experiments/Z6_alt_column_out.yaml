# Phase 6 try Z6 (loop v6, free choice; Q22): Z5 measures the Λ energy high (reco / true median 1.110 vs Z4's 1.073 on the
# same Λ) and −t worse at 9x275 (σ68 0.142 vs 0.122 GeV²). When a tagged Hcal photon carries the crystal law's energy, its
# Hcal column beyond its own cluster (column × 36.63 − the cluster's energy) stays in the neutron, so it counts twice. Z6
# removes it from the neutron, as Z2 does for crystal photons (switch crystalAltColumnOut, default false, here true).
# Patch space/notes/patches/Z6_alt_column_out.patch on a15b0db6 + Y2 + Y5 + Y9 + Z1b + Z5; build Z6.
# hypothesis: 477 --alt on Z5's settings, with and without the column out (9x275): net +303 vs +317, window +558 vs +547,
# Λ energy / true of good picks 1.058 vs 1.122 (σ68 0.113 vs 0.129); 9x130 +32 vs +32, 1.076 vs 1.126. Predicted N_found
# 1574 → ~1560, 252 → ~252 (no gain for 463); −t σ68 at 9x275 0.147 → below Z4's 0.122.
