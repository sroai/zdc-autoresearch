# Phase 6 calibration input (loop v6, F4: calibrations on guns only): the neutron gun D3 (20–275 GeV) through Z6, the
# Phase 6 base (D-user-44), with the Phase 6 cluster collections. Read by 480 --guns: the tagged Hcal clusters that are
# not the leading one are neutron fragments the photon tag lets through; their distance to the neutron core and their
# crystal energy in front are the fragment side of the photon-likeness term of the next try (Z7). The Hcal and crystal
# clustering are Y9's (Z6 changes only the neutrals factory), so the parameters below are Z6's for one install only.
name: CAL6_D3_Z6
eicrecon_ref: e5e2a60c60b6a10a25cbe35497da1d4996a492df
install_label: Z6
source_commit: a15b0db6
parameters:
  B0ECAL:B0ECalIslandProtoClusters:splitCluster: 1
  B0ECAL:B0ECalIslandProtoClusters:transverseEnergyProfileMetric: dimScaledLocalDistXY
  B0ECAL:B0ECalIslandProtoClusters:transverseEnergyProfileScale: 0.3
  reco:ReconstructedFarForwardNeutrals:gammaScaleCorrCoeffB0Ecal: "1.0888,1.0058"
  reco:ReconstructedFarForwardNeutrals:crystalClusterEmin: 0.3
  reco:ReconstructedFarForwardNeutrals:crystalColumnRadius: 60
  reco:ReconstructedFarForwardNeutrals:crystalGammaLaw: "1.9092,44.768,-0.8984"
  reco:ReconstructedFarForwardNeutrals:crystalColumnNeutronScale: 36.63
  reco:ReconstructedFarForwardNeutrals:lambdaPairingLambdaSigma: 0.03
  reco:ReconstructedFarForwardNeutrals:crystalAltColumnOut: 1
nthreads: 1
datasets: [D3_neutron]
output_collections: ["EventHeader", "HcalFarForwardZDCRecHits", "EcalFarForwardZDCRecHits", "HcalFarForwardZDCClusters", "EcalFarForwardZDCClusters", "HcalFarForwardZDCClusterAssociations", "EcalFarForwardZDCClusterAssociations", "ReconstructedHcalFarForwardZDCNeutrals"]
notes: "calibration input for the photon-likeness term (fragment side), Z6"
