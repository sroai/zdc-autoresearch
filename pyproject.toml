[project]
name = "zdc-autoresearch"
version = "0.1.0"
description = "Autonomous optimization of the ePIC ZDC reconstruction in EICrecon (phase-gated autoresearch loop)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "uproot>=5.3",
    "awkward>=2.6",
    "matplotlib>=3.8",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
]

[tool.uv]
package = false
